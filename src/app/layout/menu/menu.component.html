<div
  class=" bg-white shadow-md flex flex-col transition-all duration-300"
  [class.w-16]="isSidebarClosed"
  dir="rtl"
>
  <div class="p-4 text-xl font-bold border-b">حوكمة</div>

  <nav class="flex space-x-6 text-gray-700 font-medium">
    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.path"
      routerLinkActive="text-blue-600 border-b-2 border-blue-600"
      class="hover:text-blue-500 transition-colors"
    >
      {{ item.label }}
    </a>
  </nav>


  <button
    class="p-2 bg-gray-100 hover:bg-gray-200"
    (click)="toggleSidebar()"
  >
    <span class="material-icons">menu</span>
  </button>
</div>
