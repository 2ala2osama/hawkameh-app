<div class="alhokama w-full px-4">
  <!-- شريط التبويب -->
  <nav class="sub-nav mb-6">
    <div class="flex flex-wrap gap-2">
      <button 
        class="px-4 py-2 rounded-lg border border-primary text-primary hover:bg-primary/10 transition"
        (click)="showSection('policies')">
        السياسات واللوائح
      </button>
      <button 
        class="px-4 py-2 rounded-lg border border-primary text-primary hover:bg-primary/10 transition"
        (click)="showSection('structure')">
        الهيكل التنظيمي
      </button>
      <button 
        class="px-4 py-2 rounded-lg border border-primary text-primary hover:bg-primary/10 transition"
        (click)="showSection('reports')">
        تقرير المجلس
      </button>
      <button 
        class="px-4 py-2 rounded-lg border border-primary text-primary hover:bg-primary/10 transition"
        (click)="showSection('matrix')">
        مصفوفة الصلاحيات
      </button>
    </div>
  </nav>
<div class="alhokama w-full px-4">
  <!-- السياسات واللوائح -->
  <div *ngIf="currentSection === 'policies'" class="bg-white rounded-xl shadow p-6 mb-6">
    <h2 class="text-xl font-semibold mb-4">السياسات واللوائح</h2>

    <!-- سياسات المجلس -->
    <div class="mb-6">
      <h5 class="font-medium mb-2">سياسات المجلس</h5>
      <div *ngIf="authService.isAdmin(); else viewCouncil">
        <app-file-upload></app-file-upload>
        <button class="text-primary hover:underline mt-2">👁️ عرض الوثائق الحالية</button>
      </div>
      <ng-template #viewCouncil>
        <a href="#" class="px-3 py-1 border border-primary text-primary rounded hover:bg-primary/10 text-sm">
          عرض الوثائق
        </a>
      </ng-template>
    </div>

    <!-- سياسات اللجان -->
    <div class="mb-6">
      <h5 class="font-medium mb-2">سياسات اللجان</h5>
      <div *ngIf="authService.isAdmin(); else viewCommittee">
        <app-file-upload></app-file-upload>
        <button class="text-primary hover:underline mt-2">👁️ عرض الوثائق الحالية</button>
      </div>
      <ng-template #viewCommittee>
        <a href="#" class="px-3 py-1 border border-primary text-primary rounded hover:bg-primary/10 text-sm">
          عرض الوثائق
        </a>
      </ng-template>
    </div>

    <!-- السياسات الداخلية -->
    <div class="mb-6">
      <h5 class="font-medium mb-2">السياسات الداخلية</h5>
      <div *ngIf="authService.isAdmin(); else viewInternal">
        <app-file-upload></app-file-upload>
        <button class="text-primary hover:underline mt-2">👁️ عرض الوثائق الحالية</button>
      </div>
      <ng-template #viewInternal>
        <a href="#" class="px-3 py-1 border border-primary text-primary rounded hover:bg-primary/10 text-sm">
          عرض الوثائق
        </a>
      </ng-template>
    </div>
  </div>

  <!-- الهيكل التنظيمي -->
<div *ngIf="currentSection === 'structure'" class="bg-white rounded-xl shadow p-6 mb-6">
  <h2 class="text-xl font-semibold mb-4">الهيكل التنظيمي</h2>
  <div #orgChart class="w-full h-[400px] border rounded-lg bg-gray-50"></div>
</div>


  </div>

  <!-- تقرير المجلس -->
  <div *ngIf="currentSection === 'reports'" class="bg-white rounded-xl shadow p-6 mb-6">
    <h2 class="text-xl font-semibold mb-4">تقرير المجلس</h2>
    <ul class="divide-y divide-gray-200">
      <li class="flex justify-between items-center py-2" *ngFor="let year of years">
        <span>تقرير سنة 202{{ year }}: 
          <a href="#" class="text-primary hover:underline">تحميل PDF</a>
        </span>
        <app-file-upload *ngIf="authService.isAdmin()"></app-file-upload>
      </li>
    </ul>
  </div>

  <!-- مصفوفة الصلاحيات -->
  <div *ngIf="currentSection === 'matrix'" class="bg-white rounded-xl shadow p-6">
    <h2 class="text-xl font-semibold mb-4">مصفوفة الصلاحيات</h2>
    <div class="overflow-x-auto">
      <table class="min-w-full border border-gray rounded-lg text-right">
        <thead class="bg-gray-300 text-white">
          <tr>
            <th class="px-4 py-2">الدور</th>
            <th class="px-4 py-2">الصلاحية</th>
            <th class="px-4 py-2">الوصول</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200">
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-2">مدير النظام</td>
            <td class="px-4 py-2">تعديل</td>
            <td class="px-4 py-2">كامل</td>
          </tr>
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-2">الرئيس التنفيذي</td>
            <td class="px-4 py-2">قراءة</td>
            <td class="px-4 py-2">عرض فقط</td>
          </tr>
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-2">المستثمر</td>
            <td class="px-4 py-2">محدود</td>
            <td class="px-4 py-2">ملفات / تصويت</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
