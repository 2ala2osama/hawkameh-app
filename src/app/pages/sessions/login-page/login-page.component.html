<div
  dir="rtl"
  class="flex min-h-screen items-center justify-center bg-gray-100 login-bg"
>
  <div class="w-full  max-w-md bg-white rounded-2xl shadow-lg p-8">
    <div class="text-center flex items-center justify-center">
      <img src="/images/logo.png" alt="Logo" width="100" height="100"  />
    </div>
    <!-- <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
        تسجيل الدخول - حوكمة
    </h2> -->

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700"
          >البريد الإلكتروني</label
        >
        <input
          type="email"
          formControlName="username"
          class="mt-1 block w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-right"
          placeholder="أدخل بريدك الإلكتروني"
        />
        <!-- <div
          *ngIf="
            loginForm.get('username')?.touched && loginForm.get('username')?.invalid
          "
          class="text-sm text-red-500 mt-1"
        >
          يرجى إدخال بريد إلكتروني صالح.
        </div> -->
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700"
          >كلمة المرور</label
        >
        <input
          type="password"
          formControlName="password"
          class="mt-1 block w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-right"
          placeholder="أدخل كلمة المرور"
        />
        <!-- <div
          *ngIf="
            loginForm.get('password')?.touched &&
            loginForm.get('password')?.invalid
          "
          class="text-sm text-red-500 mt-1"
        >
          يجب أن تتكون كلمة المرور من 6 أحرف على الأقل.
        </div> -->
      </div>

      <!-- Submit -->
      <button
        type="submit"
        (click)="onSubmit()"
        class="w-full bg-primary text-white py-2 rounded-lg hover:bg-primary/90 transition"
      >
        دخول
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-600">
      ليس لديك حساب؟
      <a routerLink="/register" class="text-primary hover:underline"
        >إنشاء حساب</a
      >
    </p>
  </div>
</div>
