<div class="overflow-x-auto bg-gray-50 p-4 rounded-lg shadow">
  <table class="min-w-full border-collapse border border-gray-200 rounded-lg">
    <thead class="bg-gray-300 text-black">
      <tr>
        <th *ngFor="let col of columns" class="px-4 py-2 text-center font-medium">
          {{ col.label }}
        </th>
        <th class="px-4 py-2 text-center font-medium">الإجراءات</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of paginatedData; let i = index"
          class="text-center border-t border-gray-200 hover:bg-gray-100 transition cursor-pointer">
        <td *ngFor="let col of columns" class="px-4 py-2">
          {{ row[col.field] }}
        </td>
        <td class="px-4 py-2 flex justify-center gap-2">
          <button (click)="edit.emit(row)"
                  class="px-3 py-1 bg-gray-500 text-white rounded hover:bg-gray-600 transition">
            تعديل
          </button>
          <button (click)="delete.emit(row)"
                  class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600 transition">
            حذف
          </button>
        </td>
      </tr>
      <tr *ngIf="data.length === 0">
        <td [attr.colspan]="columns.length + 1" class="px-4 py-2 text-gray-500">
          لا توجد بيانات بعد
        </td>
      </tr>
    </tbody>
  </table>

  
</div>
