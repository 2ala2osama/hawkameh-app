<!-- يظهر فقط إذا المستخدم أدمن -->
<div *ngIf="authService.isAdmin()" class="mb-4">
  <div class="flex items-center gap-2">
    <!-- زر اختيار الملف -->
    <label
      class="flex items-center px-4 py-2 bg-white border border-primary rounded-lg shadow-sm cursor-pointer hover:bg-primary/10 transition"
    >
      <input
        type="file"
        class="hidden"
        (change)="onFileSelected($event)"
        accept=".pdf,.docx,.jpg,.png,.jpeg"
      />
      📂 اختر ملف
    </label>

    <!-- زر رفع الملف -->
    <button
      type="button"
      class="px-4 py-2 bg-primary text-white rounded-lg shadow hover:bg-primary/80 transition disabled:opacity-50 disabled:cursor-not-allowed"
      (click)="uploadFile()"
      [disabled]="!selectedFile"
    >
      ⬆️ رفع الملف
    </button>
  </div>
</div>

<!-- يظهر إذا تم اختيار ملف -->
<div *ngIf="selectedFile" class="mt-3 text-sm text-gray-600">
  <ng-container *ngIf="isImage && previewUrl && sendFlag;">
    <div class="flex justify-center">
      <img [src]="previewUrl" alt="Preview" class="max-h-96 rounded-lg shadow" />
    </div>
  </ng-container>

  <!-- عرض اسم الملف فقط -->
  <ng-template  *ngIf="visible">
    📄 الملف المحدد:
    <span class="font-semibold text-gray-800">{{ selectedFile.name }}</span>
  </ng-template>
</div>
