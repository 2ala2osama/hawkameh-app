<!-- يظهر فقط إذا المستخدم أدمن -->
<div *ngIf="authService.isAdmin()" class="mb-4">
  <div class="flex items-center gap-2">
    <!-- Input file -->
    <label
      class="flex items-center px-4 py-2 bg-white border border-primary rounded-lg shadow-sm cursor-pointer hover:bg-primary/10 transition"
    >
      <input
        type="file"
        class="hidden"
        (change)="onFileSelected($event)"
        accept=".pdf,.docx"
      />
      📂 اختر ملف
    </label>

    <!-- Upload button -->
    <button
      type="button"
      class="px-4 py-2 bg-primary text-white rounded-lg shadow hover:bg-primary/80 transition disabled:opacity-50 disabled:cursor-not-allowed"
      (click)="uploadFile()"
      [disabled]="!selectedFile"
    >
      ⬆️ رفع الملف
    </button>
  </div>
</div>

<!-- يظهر إذا تم اختيار ملف -->
<p *ngIf="selectedFile" class="mt-3 text-sm text-gray-600">
  📄 الملف المحدد: 
  <span class="font-semibold text-gray-800">{{ selectedFile.name }}</span>
</p>
